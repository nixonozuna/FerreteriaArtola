spring.application.name=SistemaFerreteriaArtola
server.port=${PORT:8080}

spring.thymeleaf.cache=false

# Base de datos H2 en memoria (Autónoma y sin bloqueos de red)
spring.datasource.url=jdbc:h2:mem:ferreteriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA para crear tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false