spring.application.name=SistemaFerreteriaArtola
server.port=${PORT:8080}

spring.thymeleaf.cache=false

# Conexión mediante el Pooler de Supabase (Puerto 6543)
spring.datasource.url=jdbc:postgresql://db.yedsencibtcgosacaghs.supabase.co:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres
spring.datasource.password=ferreteriaartola
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Desactivar metadatos JDBC para evitar bloqueos con Supabase Pooler
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false