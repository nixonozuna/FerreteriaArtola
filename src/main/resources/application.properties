spring.application.name=SistemaFerreteriaArtola
server.port=${PORT:8080}

spring.thymeleaf.cache=false

# Conexión al Pooler de Supabase con puerto 6543 y prepareThreshold=0
spring.datasource.url=jdbc:postgresql://db.yedsencibtcgosacaghs.supabase.co:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres
spring.datasource.password=ferreteriaartola
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Propiedades críticas para evitar bloqueos con el Pooler (PgBouncer) de Supabase
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000