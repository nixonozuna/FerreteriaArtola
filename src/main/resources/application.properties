spring.application.name=SistemaFerreteriaArtola
server.port=${PORT:8080}

spring.thymeleaf.cache=false

# Cambiado al puerto 5432 para conexión directa y estable desde Render hacia Supabase
spring.datasource.url=jdbc:postgresql://db.yedsencibtcgosacaghs.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=ferreteriaartola
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Mostrar detalles de errores en las vistas si es necesario
server.error.include-stacktrace=always
server.error.include-message=always

# Activar logs SQL para ver si se conecta a Supabase y qué tablas consulta
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace