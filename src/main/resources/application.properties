spring.application.name=SistemaFerreteriaArtola
server.port=${PORT:8080}

spring.thymeleaf.cache=false

# Conexión directa a Supabase con SSL
spring.datasource.url=jdbc:postgresql://db.yedsencibtcgosacaghs.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=ferreteriaartola
spring.datasource.driver-class-name=org.postgresql.Driver

# Respaldo explícito para Hibernate 6 / Jakarta Persistence en la nube
spring.jpa.properties.jakarta.persistence.jdbc.url=jdbc:postgresql://db.yedsencibtcgosacaghs.supabase.co:5432/postgres?sslmode=require
spring.jpa.properties.jakarta.persistence.jdbc.user=postgres
spring.jpa.properties.jakarta.persistence.jdbc.password=ferreteriaartola

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false