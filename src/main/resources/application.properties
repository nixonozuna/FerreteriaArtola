spring.application.name=SistemaFerreteriaArtola

# Desactivar caché de Thymeleaf
spring.thymeleaf.cache=false

# Conexión directa a Supabase con SSL requerido
spring.datasource.url=jdbc:postgresql://db.yedsencibtcgosacaghs.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=ferreteriaartola
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA y Dialecto Explícito para Hibernate 6
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}