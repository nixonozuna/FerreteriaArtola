spring.application.name=SistemaFerreteriaArtola
server.port=${PORT:8080}

spring.thymeleaf.cache=false

# Base de datos H2 en memoria (No requiere internet ni conexión externa)
spring.datasource.url=jdbc:h2:mem:ferreteriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA para que cree las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect