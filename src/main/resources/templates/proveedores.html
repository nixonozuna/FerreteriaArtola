<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Proveedores - Ferretería Artola</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #1e293b, #0f172a); }
        .card-modern { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .form-label { font-weight: 500; color: #475569; font-size: 0.85rem; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px 12px; font-size: 0.9rem; }
        .table thead { background-color: #0f172a; color: white; }
        .fila-tabla { cursor: pointer; transition: background-color 0.2s; }
        .fila-tabla:hover { background-color: #e2e8f0 !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">🛠️ Ferretería Artola - Panel de Control</span>
        <a href="/usuarios" class="btn btn-outline-light btn-sm px-3 fw-semibold">👥 Ir a Gestión de Usuarios</a>
    </div>
</nav>

<div class="container py-4">

    <div class="card card-modern p-4 mb-5 bg-white">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center pb-3 mb-4 border-bottom gap-3">
            <h4 class="fw-bold text-dark m-0">Gestión de Usuarios</h4>

            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-primary fw-semibold px-3 shadow-sm" onclick="BotonAgregar()">
                    ➕ Agregar
                </button>
                <button type="button" class="btn btn-warning fw-semibold text-white px-3 shadow-sm" onclick="BotonModificar()">
                    ✏️ Modificar
                </button>
                <button type="button" class="btn btn-secondary fw-semibold px-3 shadow-sm" onclick="LimpiarFormulario()">
                    🧹 Limpiar
                </button>
                <button type="button" class="btn btn-outline-secondary fw-semibold px-3 shadow-sm" onclick="BloquearFormulario()">
                    ❌ Cancelar
                </button>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show fw-medium" role="alert">
            <span>⚠️ </span><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/proveedores/guardar}" method="post" id="proveedorForm" class="row g-3">

            <input type="hidden" name="idproveedor" id="idproveedor">
            <input type="hidden" id="siguientecodigoOculto" th:value="${siguientecodigo}">

            <div class="col-md-3">
                <label class="form-label">Código Proveedor</label>
                <input type="text" id="codigoproveedor" name="codigoproveedor" th:value="${siguientecodigo}" class="form-control bg-light fw-bold text-primary" readonly>
            </div>

            <div class="col-md-5">
                <label class="form-label">Razón Social</label>
                <input type="text" id="razonsocial" name="razonsocial" maxlength="50" class="form-control campo-control" disabled required placeholder="Ej: Distribuidora Ferretera S.A.">
            </div>

            <div class="col-md-4">
                <label class="form-label">Teléfono</label>
                <input type="text" id="telefono" name="telefono" maxlength="9" class="form-control campo-control" disabled required placeholder="0000-0000" oninput="FormatearTelefono(this)">
            </div>

            <div class="col-md-5">
                <label class="form-label">Correo Electrónico (Opcional)</label>
                <input type="email" id="email" name="email" maxlength="100" class="form-control campo-control" disabled placeholder="contacto@proveedor.com">
            </div>

            <div class="col-md-4">
                <label class="form-label">Dirección</label>
                <input type="text" id="direccion" name="direccion" maxlength="100" class="form-control campo-control" disabled required placeholder="Ej: Km 5 Carretera Norte, Managua">
            </div>

            <div class="col-md-3">
                <label class="form-label">Estado del Proveedor</label>
                <select name="estado" id="campoEstado" class="form-select campo-control" disabled required>
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Fecha de Registro</label>
                <input type="text" id="fecharegistro" class="form-control bg-light text-muted" readonly th:value="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}">
            </div>

            <div class="col-12 mt-3">
                <button type="submit" id="btnGuardar" class="btn btn-success px-4 fw-semibold shadow-sm" disabled>💾 Guardar en Base de Datos</button>
            </div>
        </form>
    </div>

    <div class="card card-modern p-4 bg-white">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h5 class="fw-bold text-dark m-0">Proveedores Registrados en el Sistema</h5>
            </div>

            <div class="input-group" style="max-width: 320px;">
                <span class="input-group-text bg-light text-muted">🔍</span>
                <input type="text" id="inputFiltroBusqueda" class="form-control" placeholder="Filtrar código, razón social..." oninput="FiltrarTablaProveedores()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tablaProveedores">
                <thead>
                <tr>
                    <th>Código Proveedor</th>
                    <th>Razón Social</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th>Fecha Registro</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(proveedores)}">
                    <td colspan="7" class="text-center py-4 text-muted">No hay proveedores registrados todavía.</td>
                </tr>
                <tr th:each="p : ${proveedores}" class="fila-tabla"
                    th:data-id="${p.idproveedor}"
                    th:data-codigo="${p.codigoproveedor}"
                    th:data-razonsocial="${p.razonsocial}"
                    th:data-telefono="${p.telefono}"
                    th:data-email="${p.email}"
                    th:data-direccion="${p.direccion}"
                    th:data-estado="${p.estado}"
                    onclick="SeleccionarProveedorDesdeTabla(this)">
                    <td class="fw-semibold text-primary" th:text="${p.codigoproveedor}"></td>
                    <td class="fw-bold text-dark" th:text="${p.razonsocial}"></td>
                    <td th:text="${p.telefono}"></td>
                    <td class="text-muted" th:text="${p.email != null ? p.email : 'Sin correo'}"></td>
                    <td th:text="${p.direccion}"></td>
                    <td>
                        <span class="badge" th:classappend="${p.estado} ? 'bg-success' : 'bg-danger'" th:text="${p.estado} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td class="text-muted" th:text="${p.fecharegistro != null ? #temporals.format(p.fecharegistro, 'dd/MM/yyyy') : 'N/A'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function HabilitarCampos() {
        let campos = document.querySelectorAll('.campo-control');
        campos.forEach(campo => {
            campo.removeAttribute('disabled');
        });
        document.getElementById('btnGuardar').removeAttribute('disabled');
    }

    function BotonAgregar() {
        LimpiarFormulario();
        HabilitarCampos();
        let codigoSiguiente = document.getElementById('siguientecodigoOculto').value;
        document.getElementById('codigoproveedor').value = codigoSiguiente;
    }

    function LimpiarFormulario() {
        document.getElementById('proveedorForm').reset();
        document.getElementById('idproveedor').value = '';
        let codigoSiguiente = document.getElementById('siguientecodigoOculto').value;
        document.getElementById('codigoproveedor').value = codigoSiguiente;
    }

    function BloquearFormulario() {
        LimpiarFormulario();
        let campos = document.querySelectorAll('.campo-control');
        campos.forEach(campo => {
            campo.setAttribute('disabled', 'true');
        });
        document.getElementById('btnGuardar').setAttribute('disabled', 'true');
    }

    function SeleccionarProveedorDesdeTabla(element) {
        document.getElementById('idproveedor').value = element.getAttribute('data-id');
        document.getElementById('codigoproveedor').value = element.getAttribute('data-codigo');
        document.getElementById('razonsocial').value = element.getAttribute('data-razonsocial');
        document.getElementById('telefono').value = element.getAttribute('data-telefono');
        document.getElementById('direccion').value = element.getAttribute('data-direccion');

        let mail = element.getAttribute('data-email');
        document.getElementById('email').value = (mail && mail !== 'null') ? mail : '';

        let estado = element.getAttribute('data-estado');
        document.getElementById('campoEstado').value = (estado === 'true' || estado === true) ? "true" : "false";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('proveedorForm').addEventListener('submit', function() {
        HabilitarCampos();
    });

    function FormatearTelefono(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length > 4) {
            valor = valor.slice(0, 4) + '-' + valor.slice(4, 8);
        }
        input.value = valor;
    }

    function BotonModificar() {
        let idproveedor = document.getElementById('idproveedor').value;
        if (!idproveedor) {
            alert("Por favor, selecciona primero un proveedor de la tabla haciendo clic sobre él.");
        } else {
            HabilitarCampos();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function FiltrarTablaProveedores() {
        let filtro = document.getElementById('inputFiltroBusqueda').value.toLowerCase();
        let filas = document.querySelectorAll('#tablaProveedores tbody tr.fila-tabla');

        filas.forEach(fila => {
            let codigo = fila.children[0].innerText.toLowerCase();
            let razonsocial = fila.children[1].innerText.toLowerCase();
            let direccion = fila.children[4].innerText.toLowerCase();

            if (codigo.includes(filtro) || razonsocial.includes(filtro) || direccion.includes(filtro)) {
                fila.style.display = "";
            } else {
                fila.style.display = "none";
            }
        });
    }
</script>
</body>
</html>
