<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Roles - Ferretería Artola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #1e293b, #0f172a); }
        .card-modern { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .form-label { font-weight: 500; color: #475569; font-size: 0.85rem; }
        .form-control { border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px 12px; font-size: 0.9rem; }
        .table thead { background-color: #0f172a; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">🛡️ Ferretería Artola - Módulo de Roles</span>
        <a href="/usuarios" class="btn btn-outline-light btn-sm px-3 fw-semibold">👥 Ir a Usuarios</a>
    </div>
</nav>

<div class="container py-4">

    <!-- Formulario para Registrar / Gestionar Roles -->
    <div class="card card-modern p-4 mb-4 bg-white">
        <div class="pb-3 mb-3 border-bottom">
            <h4 class="fw-bold text-dark m-0">Registro de Roles</h4>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show fw-medium" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/roles/guardar}" th:object="${rol}" method="post" class="row g-3">
            <input type="hidden" th:field="*{idRol}" id="idRol">

            <div class="col-md-8">
                <label class="form-label">Descripción del Rol</label>
                <input type="text" th:field="*{descripcion}" maxlength="50" class="form-control" required placeholder="Ej: Cajero, Supervisor...">
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100 fw-semibold shadow-sm">💾 Guardar Rol</button>
            </div>
        </form>
    </div>

    <!-- Tabla de Roles Registrados -->
    <div class="card card-modern p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <h4 class="fw-bold text-dark m-0">Roles del Sistema (Supabase)</h4>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID Rol</th>
                    <th>Descripción del Rol</th>
                    <th>Fecha de Registro</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(roles)}">
                    <td colspan="3" class="text-center py-4 text-muted">No hay roles registrados en la base de datos.</td>
                </tr>
                <tr th:each="r : ${roles}">
                    <td class="fw-semibold text-primary" th:text="${r.idRol}"></td>
                    <td class="fw-bold" th:text="${r.descripcion}"></td>
                    <td class="text-muted" th:text="${r.fechaRegistro != null ? #temporals.format(r.fechaRegistro, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
