<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Unidades de Medida - Ferretería Artola</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #1e293b, #0f172a); }
        .card-modern { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .form-label { font-weight: 500; color: #475569; font-size: 0.85rem; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px 12px; font-size: 0.9rem; }
        .table thead { background-color: #0f172a; color: white; }
        .fila-tabla { cursor: pointer; transition: background-color 0.2s; }
        .fila-tabla:hover { background-color: #e2e8f0 !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">🛠️ Ferretería Artola - Panel de Control</span>
        <a href="/usuarios" class="btn btn-outline-light btn-sm px-3 fw-semibold">👥 Ir a Gestión de Usuarios</a>
    </div>
</nav>

<div class="container py-4">

    <div class="card card-modern p-4 mb-5 bg-white">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center pb-3 mb-4 border-bottom gap-3">
            <h4 class="fw-bold text-dark m-0">Gestión de Usuarios</h4>

            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-primary fw-semibold px-3 shadow-sm" onclick="BotonAgregar()">
                    ➕ Agregar
                </button>
                <button type="button" class="btn btn-warning fw-semibold text-white px-3 shadow-sm" onclick="BotonModificar()">
                    ✏️ Modificar
                </button>
                <button type="button" class="btn btn-secondary fw-semibold px-3 shadow-sm" onclick="LimpiarFormulario()">
                    🧹 Limpiar
                </button>
                <button type="button" class="btn btn-outline-secondary fw-semibold px-3 shadow-sm" onclick="BloquearFormulario()">
                    ❌ Cancelar
                </button>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show fw-medium" role="alert">
            <span>⚠️ </span><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/unidadesmedidas/guardar}" method="post" id="unidadMedidaForm" class="row g-3">

            <input type="hidden" name="idunidadmedida" id="idunidadmedida">
            <input type="hidden" id="siguientecodigoOculto" th:value="${siguientecodigo}">

            <div class="col-md-3">
                <label class="form-label">Código Unidad</label>
                <input type="text" id="codigounidadmedida" name="codigounidadmedida" th:value="${siguientecodigo}" class="form-control bg-light fw-bold text-primary" readonly>
            </div>

            <div class="col-md-6">
                <label class="form-label">Nombre de la Unidad</label>
                <input type="text" id="nombre" name="nombre" maxlength="50" class="form-control campo-control" disabled required placeholder="Ej: Metro, Litro, Libra, Kilogramo, Unidad">
            </div>

            <div class="col-md-3">
                <label class="form-label">Fecha de Registro</label>
                <input type="text" id="fecharegistro" class="form-control bg-light text-muted" readonly th:value="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}">
            </div>

            <div class="col-12 mt-3">
                <button type="submit" id="btnGuardar" class="btn btn-success px-4 fw-semibold shadow-sm" disabled>💾 Guardar en Base de Datos</button>
            </div>
        </form>
    </div>

    <div class="card card-modern p-4 bg-white">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h5 class="fw-bold text-dark m-0">Unidades de Medida Registradas</h5>
            </div>

            <div class="input-group" style="max-width: 320px;">
                <span class="input-group-text bg-light text-muted">🔍</span>
                <input type="text" id="inputFiltroBusqueda" class="form-control" placeholder="Filtrar código, nombre..." oninput="FiltrarTablaUnidades()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tablaUnidades">
                <thead>
                <tr>
                    <th>Código Unidad Medida</th>
                    <th>Nombre</th>
                    <th>Fecha Registro</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(unidades)}">
                    <td colspan="3" class="text-center py-4 text-muted">No hay unidades de medida registradas todavía.</td>
                </tr>
                <tr th:each="u : ${unidades}" class="fila-tabla"
                    th:data-id="${u.idunidadmedida}"
                    th:data-codigo="${u.codigounidadmedida}"
                    th:data-nombre="${u.nombre}"
                    onclick="SeleccionarUnidadDesdeTabla(this)">
                    <td class="fw-semibold text-primary" th:text="${u.codigounidadmedida}"></td>
                    <td class="fw-bold text-dark" th:text="${u.nombre}"></td>
                    <td class="text-muted" th:text="${u.fecharegistro != null ? #temporals.format(u.fecharegistro, 'dd/MM/yyyy') : 'N/A'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function HabilitarCampos() {
        let campos = document.querySelectorAll('.campo-control');
        campos.forEach(campo => {
            campo.removeAttribute('disabled');
        });
        document.getElementById('btnGuardar').removeAttribute('disabled');
    }

    function BotonAgregar() {
        LimpiarFormulario();
        HabilitarCampos();
        let codigoSiguiente = document.getElementById('siguientecodigoOculto').value;
        document.getElementById('codigounidadmedida').value = codigoSiguiente;
    }

    function LimpiarFormulario() {
        document.getElementById('unidadMedidaForm').reset();
        document.getElementById('idunidadmedida').value = '';
        let codigoSiguiente = document.getElementById('siguientecodigoOculto').value;
        document.getElementById('codigounidadmedida').value = codigoSiguiente;
    }

    function BloquearFormulario() {
        LimpiarFormulario();
        let campos = document.querySelectorAll('.campo-control');
        campos.forEach(campo => {
            campo.setAttribute('disabled', 'true');
        });
        document.getElementById('btnGuardar').setAttribute('disabled', 'true');
    }

    function SeleccionarUnidadDesdeTabla(element) {
        document.getElementById('idunidadmedida').value = element.getAttribute('data-id');
        document.getElementById('codigounidadmedida').value = element.getAttribute('data-codigo');
        document.getElementById('nombre').value = element.getAttribute('data-nombre');

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('unidadMedidaForm').addEventListener('submit', function() {
        HabilitarCampos();
    });

    function BotonModificar() {
        let idunidad = document.getElementById('idunidadmedida').value;
        if (!idunidad) {
            alert("Por favor, selecciona primero una unidad de medida de la tabla haciendo clic sobre ella.");
        } else {
            HabilitarCampos();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function FiltrarTablaUnidades() {
        let filtro = document.getElementById('inputFiltroBusqueda').value.toLowerCase();
        let filas = document.querySelectorAll('#tablaUnidades tbody tr.fila-tabla');

        filas.forEach(fila => {
            let codigo = fila.children[0].innerText.toLowerCase();
            let nombre = fila.children[1].innerText.toLowerCase();

            if (codigo.includes(filtro) || nombre.includes(filtro)) {
                fila.style.display = "";
            } else {
                fila.style.display = "none";
            }
        });
    }
</script>
</body>
</html>
